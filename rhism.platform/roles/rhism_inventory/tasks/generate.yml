---
# ---------------------------------------------------------------------------
# generate — derive the high-signal deployment inventory content from an
# estate manifest (or direct vars): group_vars derivations, a vault skeleton,
# and the aggregated SOE chain. Composes with the wizard role — the wizard's
# generate_inventory owns hosts.yml groups; this role NEVER re-renders them.
#
# Network derivations run on the FULL CIDR with ansible.utils filters —
# deliberately fixing the upstream generator's classful /24-only octet-split
# bug (upstream schema/TODO.md, HIGH): nthhost for addresses, and one reverse
# DNS zone per /24 child so ANY prefix length gets a complete zone set.
# ---------------------------------------------------------------------------

- name: Assert generate has an estate identity source
  ansible.builtin.assert:
    that:
      - (rhism_inventory_manifest_path | length > 0)
        or (rhism_inventory_domain | length > 0
            and rhism_inventory_network_cidr | length > 0)
    fail_msg: >-
      generate needs either rhism_inventory_manifest_path (a wizard deployment
      manifest), or BOTH rhism_inventory_domain and rhism_inventory_network_cidr

- name: Read the wizard deployment manifest
  ansible.builtin.slurp:
    src: "{{ rhism_inventory_manifest_path }}"
  register: _rhism_inventory_manifest_raw
  when: rhism_inventory_manifest_path | length > 0

- name: Resolve the estate identity (manifest wins over direct vars)
  ansible.builtin.set_fact:
    _rhism_inventory_gen_domain: >-
      {{ _rhism_inventory_manifest.network.domain
         if rhism_inventory_manifest_path | length > 0
         else rhism_inventory_domain }}
    _rhism_inventory_gen_realm: >-
      {{ _rhism_inventory_manifest.network.realm
         | default(_rhism_inventory_manifest.network.domain | upper)
         if rhism_inventory_manifest_path | length > 0
         else rhism_inventory_domain | upper }}
    _rhism_inventory_gen_cidr: >-
      {{ _rhism_inventory_manifest.network.subnet
         if rhism_inventory_manifest_path | length > 0
         else rhism_inventory_network_cidr }}
  vars:
    _rhism_inventory_manifest: >-
      {{ (_rhism_inventory_manifest_raw.content | b64decode | from_yaml)
         if rhism_inventory_manifest_path | length > 0 else {} }}

- name: Derive the estate addresses from the full CIDR
  ansible.builtin.set_fact:
    _rhism_inventory_dns_ip: >-
      {{ _rhism_inventory_gen_cidr | ansible.utils.nthhost(rhism_inventory_dns_host_offset | int) }}
    _rhism_inventory_gateway_ip: >-
      {{ _rhism_inventory_gen_cidr | ansible.utils.nthhost(rhism_inventory_gateway_offset | int) }}
    _rhism_inventory_reverse_zone_count: >-
      {{ _rhism_inventory_gen_cidr | ansible.utils.ipsubnet(24)
         if (_rhism_inventory_gen_cidr | ansible.utils.ipaddr('prefix')) | int <= 24
         else 1 }}

- name: Reset the reverse-zone accumulator
  # Explicit reset — set_fact results persist across plays in one run (BUG-060).
  ansible.builtin.set_fact:
    _rhism_inventory_reverse_zones: []

- name: Derive one reverse DNS zone per /24 child (classless-safe)
  ansible.builtin.set_fact:
    _rhism_inventory_reverse_zones: >-
      {{ _rhism_inventory_reverse_zones + [_rhism_inventory_zone] }}
  vars:
    _rhism_inventory_zone_subnet: >-
      {{ _rhism_inventory_gen_cidr | ansible.utils.ipsubnet(24, item)
         if (_rhism_inventory_gen_cidr | ansible.utils.ipaddr('prefix')) | int <= 24
         else _rhism_inventory_gen_cidr }}
    _rhism_inventory_zone: >-
      {{ (_rhism_inventory_zone_subnet | ansible.utils.ipaddr('revdns')).split('.')[1:-1] | join('.') }}
  loop: "{{ range(0, _rhism_inventory_reverse_zone_count | int) | list }}"
  loop_control:
    label: "/24 child {{ item }}"

- name: Ensure the deployment tree directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ rhism_inventory_output_dir }}/deployment/group_vars/all"
      mode: "0755"
    - path: "{{ rhism_inventory_output_dir }}/deployment/vault"
      mode: "{{ rhism_inventory_vault_dir_mode }}"
  loop_control:
    label: "{{ item.path }}"

- name: Write the derived group_vars
  ansible.builtin.copy:
    dest: "{{ rhism_inventory_output_dir }}/deployment/group_vars/all/derived.yml"
    mode: "0644"
    content: |
      ---
      # Generated by rhism.platform.rhism_inventory (generate).
      # Estate derivations computed on the full CIDR with ansible.utils —
      # never classful octet-split (correct for any prefix length).
      {{ _rhism_inventory_derived | to_nice_yaml(indent=2) }}
  vars:
    _rhism_inventory_derived:
      rhism_domain: "{{ _rhism_inventory_gen_domain }}"
      rhism_realm: "{{ _rhism_inventory_gen_realm }}"
      rhism_network_cidr: "{{ _rhism_inventory_gen_cidr }}"
      rhism_dns_server_ip: "{{ _rhism_inventory_dns_ip }}"
      rhism_gateway_ip: "{{ _rhism_inventory_gateway_ip }}"
      rhism_reverse_dns_zones: "{{ _rhism_inventory_reverse_zones }}"
      rhism_time_servers: "{{ rhism_inventory_time_servers }}"

- name: Write the vault skeleton README
  ansible.builtin.copy:
    dest: "{{ rhism_inventory_output_dir }}/deployment/vault/README.md"
    mode: "0600"
    content: |
      # vault/ — secrets skeleton (deliberately empty)

      This directory exists (mode {{ rhism_inventory_vault_dir_mode }}) so the
      deployment tree has a restrictive, ready-made home for vault-encrypted
      variable files. NO secret is ever generated here: real credentials are
      hand-authored by the operator as ansible-vault files (or kept entirely
      outside the tree and mounted at run time, the upstream travel path).
      Generated content must stay secret-free by design.

- name: Aggregate the SOE chain into the deployment tree
  ansible.builtin.include_tasks:
    file: aggregate.yml
  vars:
    _rhism_inventory_aggregate_dest: >-
      {{ rhism_inventory_output_dir }}/deployment/group_vars/all/aggregated_soe.yml

- name: Report the generate summary
  ansible.builtin.debug:
    msg:
      - "deployment tree written under {{ rhism_inventory_output_dir }}/deployment"
      - "domain={{ _rhism_inventory_gen_domain }} realm={{ _rhism_inventory_gen_realm }}"
      - "dns={{ _rhism_inventory_dns_ip }} gateway={{ _rhism_inventory_gateway_ip }}"
      - "reverse zones: {{ _rhism_inventory_reverse_zones | join(', ') }}"
