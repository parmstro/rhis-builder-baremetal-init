---
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Deploy sudo policy for groups
  ansible.builtin.template:
    src: sudoers_groups.j2
    dest: /etc/sudoers.d/linux_users_groups
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: linux_users_sudo_nopasswd_groups | length > 0

- name: Deploy sudo policy for users
  ansible.builtin.template:
    src: sudoers_users.j2
    dest: /etc/sudoers.d/linux_users_users
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: linux_users_sudo_nopasswd_users | length > 0
