---
# Dispatcher variable — selects which task file(s) to run.
linux_packages_action: all

# Packages to remove (insecure legacy services).
linux_packages_remove:
  - telnet
  - rsh
  - rsh-server
  - ypserv
  - ypbind
  - tftp
  - tftp-server
  - xinetd

# Packages to install (security tooling).
linux_packages_install:
  - aide
  - rkhunter
  - audit
  - firewalld

# Set to true to enable EPEL before installing packages.
# Required for aide, rkhunter on EL systems without EPEL already configured.
linux_packages_enable_epel: false

# Post-install initialisation (opt-in — real hosts want these; containers/CI
# usually don't: aide --init is slow and rkhunter --update may need network).
# AIDE: build + activate the baseline database so scheduled integrity checks work.
linux_packages_aide_init: false
# rkhunter: refresh data files (--update) and baseline file properties (--propupd).
linux_packages_rkhunter_init: false

# Packages to upgrade when action=patch.
# Populated at runtime from CMDB CVE exposure data; override via -e or inventory.
linux_packages_patch: []

# Minimum CVSS severity to include in auto-patch list when deriving from CMDB.
# Values: CRITICAL, HIGH, MEDIUM, LOW — defaults to HIGH (includes CRITICAL).
linux_packages_patch_min_severity: HIGH

# CMDB API base URL used by the patch action to derive the package list.
linux_packages_cmdb_api_url: "http://localhost:5000"
