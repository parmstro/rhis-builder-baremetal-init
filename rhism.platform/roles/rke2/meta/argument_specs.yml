---
argument_specs:
  main:
    short_description: Install and manage an RKE2 Kubernetes cluster.
    description: >-
      Standalone-first Kubernetes-distro product role for container_platform. Installs RKE2
      (server or agent), manages its config/service, node join/eviction, in-place upgrades,
      etcd snapshot backup/restore, and teardown. Consumes the shared container-platform
      interface (bare action + cp_* vars) so the container_platform dispatcher can select any
      distro (k3s/rke2/okd/ocp) with identical code.
    options:
      action:
        description: >-
          Lifecycle action, shared across all container-platform distros. 'present'/'absent'
          install or remove RKE2; 'configure' deploys config + kubeconfig; 'started'/'stopped'/
          'restarted' manage the service; 'add_node'/'remove_node' join or evict a worker;
          'upgrade' upgrades in place; 'backup'/'restore' handle etcd snapshots; 'reset' is a
          confirmed teardown; 'status' reports cluster state.
        type: str
        default: present
        choices:
          - present
          - absent
          - configure
          - started
          - stopped
          - restarted
          - add_node
          - remove_node
          - upgrade
          - backup
          - restore
          - reset
          - status
      cp_node_role:
        description: >-
          Node role. 'control_plane' installs an rke2-server; 'worker' installs an rke2-agent.
          Shared container-platform interface var.
        type: str
        default: control_plane
        choices:
          - control_plane
          - worker
      cp_install_version:
        description: >-
          RKE2 version to pin (INSTALL_RKE2_VERSION). Empty selects the latest release.
        type: str
        default: ""
      cp_server_url:
        description: Server join URL written to the agent config for a worker / add_node.
        type: str
        default: ""
      cp_node_token:
        description: Cluster join token written to the agent config for a worker / add_node.
        type: str
        default: ""
      cp_kubeconfig_path:
        description: >-
          Standard-path kubeconfig symlink target. A symlink is created only when this is set
          and differs from the on-node kubeconfig. Shared container-platform interface var.
        type: str
        default: /etc/rancher/rke2/rke2.yaml
      cp_backup_snapshot_name:
        description: Name for the etcd snapshot created by the 'backup' action.
        type: str
        default: "{{ inventory_hostname }}-rke2"
      cp_restore_snapshot_name:
        description: Name of the etcd snapshot to restore in the 'restore' action.
        type: str
        default: ""
      cp_reset_confirm:
        description: >-
          Safety confirmation required before the destructive 'reset' (full teardown) action.
        type: bool
        default: false
