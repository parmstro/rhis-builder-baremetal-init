---
# ── Upgrade rke2 ─────────────────────────────────────────────────────────────

- name: Run rke2 upgrade via install script  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >
      curl -sfL {{ _cp_install_script_url }} |
      {% if cp_install_version | length > 0 %}INSTALL_RKE2_VERSION="{{ cp_install_version }}"{% endif %}
      INSTALL_RKE2_TYPE="{{ 'server' if cp_node_role == 'control_plane' else 'agent' }}"
      sh -
  become: true
  changed_when: true

- name: Restart rke2-server after upgrade
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: restarted
  become: true
  when: cp_node_role == 'control_plane'

- name: Restart rke2-agent after upgrade
  ansible.builtin.service:
    name: "{{ _cp_service_name_agent }}"
    state: restarted
  become: true
  when: cp_node_role == 'worker'
