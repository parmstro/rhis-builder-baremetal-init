---
# ── Create rke2 etcd snapshot ────────────────────────────────────────────────

- name: Create rke2 etcd snapshot
  ansible.builtin.command:
    cmd: "rke2 etcd-snapshot save --name {{ cp_backup_snapshot_name | default(inventory_hostname ~ '-' ~ ansible_date_time.date) }}"
  become: true
  changed_when: true
