---
# ── Service management (started / stopped / restarted) ───────────────────────
# Consolidated — action maps directly to the service state param.

- name: Manage rke2-server service
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: "{{ action }}"
    enabled: "{{ action == 'started' }}"
  become: true
  when: cp_node_role == 'control_plane'

- name: Manage rke2-agent service
  ansible.builtin.service:
    name: "{{ _cp_service_name_agent }}"
    state: "{{ action }}"
    enabled: "{{ action == 'started' }}"
  become: true
  when: cp_node_role == 'worker'
