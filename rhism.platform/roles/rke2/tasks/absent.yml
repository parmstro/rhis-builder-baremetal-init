---
# ── Remove rke2 ──────────────────────────────────────────────────────────────

- name: Manage firewall ports for rke2
  ansible.builtin.include_tasks: firewall.yml
  vars:
    _firewall_state: disabled

- name: Remove rke2 server
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-uninstall.sh
    removes: "{{ _cp_binary }}"
  become: true
  when: cp_node_role == 'control_plane'

- name: Remove rke2 agent
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-agent-uninstall.sh
    removes: "{{ _cp_binary }}"
  become: true
  when: cp_node_role == 'worker'
