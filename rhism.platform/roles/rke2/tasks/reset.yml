---
# ── Reset rke2 (full teardown) ───────────────────────────────────────────────

- name: Assert reset confirmation flag is set
  ansible.builtin.assert:
    that: cp_reset_confirm | default(false) | bool
    fail_msg: "Set cp_reset_confirm: true to confirm full rke2 teardown"

- name: Run rke2 server uninstall script
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-uninstall.sh
    removes: "{{ _cp_binary }}"
  become: true
  changed_when: true
  when: cp_node_role == 'control_plane'

- name: Run rke2 agent uninstall script
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2-agent-uninstall.sh
    removes: "{{ _cp_binary }}"
  become: true
  changed_when: true
  when: cp_node_role == 'worker'
