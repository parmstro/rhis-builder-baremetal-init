---
# ReaR has no dry-run gate for its normal actions, and those actions install packages /
# write files / build artifacts via `become`, which cannot run on a minimal container.
# So this scenario validates the STANDALONE CONTRACT on the control host: argument-spec
# enforcement (a real negative test — the role loads fine on Linux), the shared
# backup_rear_* default contract, and the presence of every dispatch task file. Real
# ReaR backup/restore is exercised in the functional scenario and the Tier-3 KVM lab.
- name: Validate rear dispatcher + standalone variable contract (control host only)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Negative test — argument spec rejects a bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: rhism.platform.rear
          vars:
            action: bogus_action
        - name: Fail if validation did not catch invalid action
          ansible.builtin.fail:
            msg: "argument_spec should have rejected the bogus action"
      rescue:
        - name: Confirm the failure was the argument-spec rejecting the action
          ansible.builtin.assert:
            that:
              - "'value of action must be one of' in (ansible_failed_result.msg | default(''))
                 or 'Invalid value' in (ansible_failed_result.msg | default(''))
                 or 'argument_spec' in (ansible_failed_result.msg | default('') | lower)
                 or 'must be one of' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Role failed, but NOT because the argument spec rejected the bogus action
              (got: {{ ansible_failed_result.msg | default('unknown') }}). This would be a
              false pass — check the role resolves and argument_specs is enforced.
            success_msg: "PASS — bogus action correctly rejected by the argument spec"

    - name: Assert standalone variable/default contract
      ansible.builtin.assert:
        that:
          - action == 'backup'
          - backup_rear_backup_method == 'NETFS'
          - backup_rear_output_format == 'ISO'
          - backup_rear_backup_url is defined
          - backup_rear_backup_mode == 'mkbackup'
          # restore double-gate defaults CLOSED — both false out of the box.
          - backup_rear_recover_execute | bool == false
          - backup_rear_recover_confirm_irreversible | bool == false
        fail_msg: "rear standalone default contract not satisfied"

    - name: Verify a dispatch task file exists for every declared action
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../tasks/{{ item }}.yml"
      register: _rear_action_stat
      failed_when: not _rear_action_stat.stat.exists
      loop:
        - server
        - client
        - schedule
        - backup
        - verify
        - restore
        - baseline
        - install
