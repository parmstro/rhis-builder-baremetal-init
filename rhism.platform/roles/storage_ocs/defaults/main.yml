---
# storage_ocs — standalone-first defaults over the SHARED storage-backend interface.
#
# Every storage backend (storage_local_path / storage_nfs / storage_longhorn / storage_ocs)
# consumes the SAME variable names, so the container_platform orchestrator selects any of
# them with one identical call — `include_role: name="storage_{{ cp_storage_type }}"` — and
# never needs per-backend code. Standalone callers set these same vars directly; the defaults
# below make the role runnable on its own.

# Shared action (all backends): storage (deploy) | present (alias) | absent (remove).
# The orchestrator passes `action` via include_role vars; this default covers standalone use.
action: storage

# Shared cluster access + storage policy (consumed by every backend, set once by the caller).
# OCS/ODF targets OpenShift, so cp_type must be ocp|okd for a real deploy.
cp_kubeconfig_path: /root/.kube/config
cp_type: ocp

# Shared dry-run gate honoured by every backend — false validates dispatch + variable
# resolution without touching the node or cluster (used by the molecule scenario).
cp_storage_execute: true

# OCS-specific hard gate: ODF is an OLM operator install with cluster-wide impact, so it is
# additionally guarded by this flag (default false) — set true to actually deploy ODF.
cp_ocs_install_execute: false

# OCS-specific tunables (only this backend reads them; still cp_storage-namespaced).
cp_storage_ocs_size: 500Gi
cp_storage_ocs_storage_class: gp2
