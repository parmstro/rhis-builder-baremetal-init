---
# Molecule default scenario for infra_wizard.
# Runs on localhost — no TTY, no whiptail. Uses wizard_profile to skip
# interactive pages and tests: dispatcher, profile loading, manifest
# generation, validation, and negative dispatch rejection.
# Collection-hosted scenario: molecule's collection-under-test auto-install
# (prerun) would try to ansible-galaxy-install this collection and its
# dependency into the workspace collections path, clobbering the loader
# symlink at collections/ansible_collections/rhism/<name> ("Cannot call
# rmtree on a symbolic link"). Disabled — local collection checkouts already
# resolve via ANSIBLE_COLLECTIONS_PATH.
prerun: false

dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: wizard-test
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    pre_build_image: true
    override_command: true

provisioner:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - converge
    - verify
    - destroy
