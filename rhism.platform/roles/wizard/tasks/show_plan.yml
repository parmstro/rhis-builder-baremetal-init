---
- name: Check manifest file exists
  ansible.builtin.stat:
    path: "{{ wizard_output_dir }}/{{ wizard_output_file }}"
  register: _wizard_manifest_stat
  tags: infra_wizard

- name: Assert manifest file present
  ansible.builtin.assert:
    that:
      - _wizard_manifest_stat.stat.exists
    fail_msg: >-
      Manifest not found at {{ wizard_output_dir }}/{{ wizard_output_file }}.
      Run wizard_action=interactive first, or wizard_action=validate to check.
  tags: infra_wizard

- name: Read manifest
  ansible.builtin.slurp:
    src: "{{ wizard_output_dir }}/{{ wizard_output_file }}"
  register: _wizard_manifest_raw
  tags: infra_wizard

- name: Parse manifest
  ansible.builtin.set_fact:
    _wizard_manifest: "{{ _wizard_manifest_raw.content | b64decode | from_yaml }}"
  tags: infra_wizard

- name: Render deployment plan
  ansible.builtin.template:
    src: deployment-plan.txt.j2
    dest: "{{ wizard_output_dir }}/deployment-plan.txt"
    mode: "0640"
  vars:
    manifest: "{{ _wizard_manifest }}"
  tags: infra_wizard

- name: Display deployment plan
  ansible.builtin.slurp:
    src: "{{ wizard_output_dir }}/deployment-plan.txt"
  register: _wizard_plan_content
  tags: infra_wizard

- name: Print deployment plan
  ansible.builtin.debug:
    msg: "{{ _wizard_plan_content.content | b64decode }}"
  tags: infra_wizard
