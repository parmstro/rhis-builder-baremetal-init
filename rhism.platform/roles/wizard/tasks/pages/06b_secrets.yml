---
- name: Select secrets management backend
  ansible.builtin.command:
    cmd: >-
      {{ wizard_tui_backend }} --title "{{ wizard_tui_title }}"
      --radiolist "Select secrets management backend:" {{ wizard_tui_height }} {{ wizard_tui_width }} 4
      "vault"    "HashiCorp Vault (server + KV v2, full lifecycle)"        OFF
      "thycotic" "Delinea/Thycotic Secret Server (existing TSS instance)"  OFF
      "ansible"  "Pure Ansible (local ISM-compliant generation, no server)" ON
      "none"     "None — manage secrets outside the platform"              OFF
      3>&1 1>&2 2>&3
  register: _wizard_secrets_result
  changed_when: false
  failed_when: _wizard_secrets_result.rc not in [0, 1]
  tags: infra_wizard

- name: Handle secrets cancel
  ansible.builtin.fail:
    msg: "Wizard cancelled by user at secrets backend selection."
  when: _wizard_secrets_result.rc == 1
  tags: infra_wizard

- name: Record secrets backend choice
  ansible.builtin.set_fact:
    wizard_components: >-
      {{ wizard_components | combine({
        'secrets': {
          'enabled': (_wizard_secrets_result.stdout | trim) != 'none',
          'type': _wizard_secrets_result.stdout | trim
        }
      }) }}
  tags: infra_wizard
