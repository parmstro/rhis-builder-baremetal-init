---
- name: Collect admin password
  ansible.builtin.command:
    cmd: >-
      {{ wizard_tui_backend }} --title "{{ wizard_tui_title }}"
      --passwordbox "Enter admin password for all services (min 12 characters):"
      8 {{ wizard_tui_width }}
      3>&1 1>&2 2>&3
  register: _wizard_adminpass_result
  changed_when: false
  failed_when: _wizard_adminpass_result.rc not in [0, 1]
  no_log: true
  tags: infra_wizard

- name: Handle credentials cancel
  ansible.builtin.fail:
    msg: "Wizard cancelled by user at credentials entry."
  when: _wizard_adminpass_result.rc == 1
  tags: infra_wizard

- name: Validate password length
  ansible.builtin.assert:
    that:
      - (_wizard_adminpass_result.stdout | trim) | length >= 12
    fail_msg: >-
      Admin password must be at least 12 characters.
      Please re-run the wizard.
  no_log: true
  tags: infra_wizard

- name: Record credentials
  ansible.builtin.set_fact:
    wizard_credentials:
      admin_password: "{{ _wizard_adminpass_result.stdout | trim }}"
  no_log: true
  tags: infra_wizard
