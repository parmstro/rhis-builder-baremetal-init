---
# Server scenario — tests the install action on an EL9 container.
# Service management is skipped (pm_vault_manage_service: false) because
# containers do not run systemd. Verifies package installation, directory
# layout, and config template rendering.
# Collection-hosted scenario: molecule's collection-under-test auto-install
# (prerun) would try to ansible-galaxy-install this collection and its
# dependency into the workspace collections path, clobbering the loader
# symlink at collections/ansible_collections/rhism/<name> ("Cannot call
# rmtree on a symbolic link"). Disabled — local collection checkouts already
# resolve via ANSIBLE_COLLECTIONS_PATH.
prerun: false

dependency:
  name: galaxy
  enabled: false

driver:
  name: docker
platforms:
  - name: vault-server-el9
    image: docker.io/almalinux:9
    pre_build_image: true
    capabilities:
      - IPC_LOCK
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
        ansible_remote_tmp: /tmp
        ansible_become_method: su
verifier:
  name: ansible
