---
# Action: status — report OKD cluster health

- name: Get node list
  ansible.builtin.command:
    cmd: oc get nodes -o wide
  register: _okd_nodes
  changed_when: false
  environment:
    KUBECONFIG: "{{ _cp_kubeconfig_path }}"

- name: Get cluster operator status
  ansible.builtin.command:
    cmd: oc get co
  register: _okd_operators
  changed_when: false
  environment:
    KUBECONFIG: "{{ _cp_kubeconfig_path }}"

- name: Display cluster health
  ansible.builtin.debug:
    msg:
      - "=== OKD nodes ==="
      - "{{ _okd_nodes.stdout_lines }}"
      - "=== Cluster operators ==="
      - "{{ _okd_operators.stdout_lines }}"
