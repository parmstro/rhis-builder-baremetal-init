---
# Functional requirements — mail_relay (requirements→test-case layer +
# Tier-3 elevation, owner rules 2026-07-12).
functional_requirements:
  - req_id: MAILRELAY-FR-001
    statement: >-
      The role SHALL deploy a REAL Postfix relay in CI and relay a message
      (functional scenario: deliver + assert receipt), consuming the shared
      mail_* family interface.
    tier: 2
    verified_by:
      - molecule: functional

  - req_id: MAILRELAY-FR-002
    statement: >-
      Relay restrictions and TLS posture SHALL match the configured
      variables (no hard-coded environment facts).
    tier: 2
    verified_by:
      - molecule: default

  - req_id: MAILRELAY-FR-003
    statement: >-
      The relay SHALL serve lab hosts as their smarthost.
    tier: 3
    verified_by:
      - lab: playbooks/mail_server.yml#mail_relay

  # --- Image-factory Wave I (FPS.md, /new-image, 2026-07-13). verified_by
  # stays empty until P4/P5 execution — UNCOVERED rendering is deliberate.
