  - {req_id: MAILRELAY-FR-005, statement: "The system SHALL reject relay attempts from outside mynetworks.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-006, statement: "The system SHALL offer STARTTLS inbound.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-007, statement: "The system SHALL attempt/enforce TLS toward the smarthost per smtp_tls_security_level.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-008, statement: "The system SHALL authenticate to the smarthost with SASL when configured.", tier: 3, verified_by: []}
  - {req_id: MAILRELAY-FR-009, statement: "The system SHALL apply alias/canonical rewriting.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-010, statement: "The system SHALL enforce message size limits.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-011, statement: "The system SHALL queue on smarthost outage and deliver on recovery, with queue visibility.", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-012, statement: "The system SHALL expose queue management operations (flush/purge role actions).", tier: 2, verified_by: []}
  - {req_id: MAILRELAY-FR-013, statement: "The system SHALL serve authenticated submission on :587 (role capability gap today).", tier: 3, verified_by: []}
