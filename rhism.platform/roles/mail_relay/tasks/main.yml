---
# mail_relay — action-driven dispatch.
#
# The action + variable interface is validated by meta/argument_specs.yml (ansible-core
# runs the validation automatically at role entry — no manual assert needed). The
# argument-spec `choices` reject any action outside the map below.

- name: "Execute task file for: {{ action }}"
  ansible.builtin.include_tasks: "{{ _mail_relay_action_map[action] }}"
