---
# mail_relay — test action (send test email)

- name: Verify test recipient is set
  ansible.builtin.assert:
    that: mail_test_recipient is defined and mail_test_recipient | length > 0
    fail_msg: "mail_test_recipient must be set to send a test message"

- name: Send test message via sendmail
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/sendmail -v {{ mail_test_recipient }}
  args:
    stdin: |
      From: ansible-test@{{ mail_hostname }}
      To: {{ mail_test_recipient }}
      Subject: Ansible mail_relay test

      This is an automated test message from the mail_relay Ansible role.
      Sent at: {{ ansible_date_time.iso8601 | default('unknown') }}
  changed_when: true
  become: true
  when: mail_execute | bool
