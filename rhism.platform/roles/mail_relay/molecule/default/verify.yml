---
- name: Verify standalone variable contract
  hosts: all
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
      delegate_to: localhost

    - name: Assert shared interface defaults resolve for standalone use
      ansible.builtin.assert:
        that:
          - action == 'present'
          - mail_execute | bool
          - mail_relay_port | int == 587
          - mail_tls_enabled | bool
          - mail_tls_security_level == 'may'
          - mail_open_smtp | bool
          - not (mail_queue_purge_confirm | bool)
          - _mail_service_name == 'postfix'
        fail_msg: "mail_relay defaults did not resolve to the expected standalone contract"
      delegate_to: localhost

    - name: Report verification passed
      ansible.builtin.debug:
        msg: "PASS — mail_relay standalone contract verified"
      delegate_to: localhost
