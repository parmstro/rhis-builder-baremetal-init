---
- name: Converge — present dry-run (dispatch + shared var contract, no install)
  hosts: all
  gather_facts: false
  vars:
    action: present
    mail_execute: false
  roles:
    - role: rhism.platform.mail_relay

- name: Converge — configure dry-run
  hosts: all
  gather_facts: false
  vars:
    action: configure
    mail_execute: false
  roles:
    - role: rhism.platform.mail_relay

- name: Converge — queue_flush dry-run
  hosts: all
  gather_facts: false
  vars:
    action: queue_flush
    mail_execute: false
  roles:
    - role: rhism.platform.mail_relay

- name: Converge — default action (standalone, no vars set) dry-run
  hosts: all
  gather_facts: false
  vars:
    mail_execute: false
  roles:
    - role: rhism.platform.mail_relay

- name: Converge — negative test (bogus action must fail)
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: rhism.platform.mail_relay
          vars:
            action: bogus_action
            mail_execute: false
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — bogus action correctly rejected"
