---
# deploy_scripts: deploy backup.sh.j2 and restore.sh.j2 to backup_restic_script_dir

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_restic_script_dir }}/restic-backup.sh"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Deploy restore script
  ansible.builtin.template:
    src: restore.sh.j2
    dest: "{{ backup_restic_script_dir }}/restic-restore.sh"
    owner: root
    group: root
    mode: "0750"
  become: true
