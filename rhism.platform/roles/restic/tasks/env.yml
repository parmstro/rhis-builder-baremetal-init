---
# Shared: set _restic_env fact used by actions that call the restic CLI.
# Included at the top of backup, restore, forget, prune, snapshots, verify, unlock.

- name: Validate restic repository credentials
  ansible.builtin.assert:
    that:
      - backup_restic_repository | length > 0
      - backup_restic_password | length > 0
    fail_msg: "backup_restic_repository and backup_restic_password are required"

- name: Set restic environment fact
  ansible.builtin.set_fact:
    _restic_env: >-
      {{ {'RESTIC_PASSWORD': backup_restic_password,
          'RESTIC_REPOSITORY': backup_restic_repository}
         | combine(backup_restic_env) }}
  no_log: true
