---
# client — full restic client setup.
# Chains: install restic → configure repository → deploy backup scripts.

- name: Install restic packages
  ansible.builtin.package:
    name: "{{ _restic_packages }}"
    state: present
  become: true

- name: Configure restic repository
  ansible.builtin.include_tasks: configure.yml

- name: Deploy backup and restore scripts
  ansible.builtin.include_tasks: deploy_scripts.yml
