---
# Action: status — report cluster node list and config check

- name: Get node list
  ansible.builtin.command:
    cmd: "{{ _cp_kubectl_cmd }} get nodes -o wide"
  register: _k3s_nodes
  changed_when: false
  become: true

- name: Run k3s check-config
  ansible.builtin.command:
    cmd: "{{ _cp_binary }} check-config"
  register: _k3s_config_check
  changed_when: false
  failed_when: false
  become: true

- name: Display cluster status
  ansible.builtin.debug:
    msg:
      - "=== k3s nodes ==="
      - "{{ _k3s_nodes.stdout_lines }}"
      - "=== k3s check-config ==="
      - "{{ _k3s_config_check.stdout_lines }}"
