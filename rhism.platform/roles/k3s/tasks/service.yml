---
# Actions: started / stopped / restarted — manage k3s service
# Consolidated: these differ only by the state parameter value

- name: Manage k3s server service
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: "{{ action }}"
    enabled: "{{ action == 'started' }}"
  become: true
  when: cp_node_role == 'control_plane'

- name: Manage k3s agent service
  ansible.builtin.service:
    name: "{{ _cp_service_name_agent }}"
    state: "{{ action }}"
    enabled: "{{ action == 'started' }}"
  become: true
  when: cp_node_role == 'worker'
