---
# Action: upgrade — in-place k3s upgrade via install script

- name: Run k3s upgrade via install script  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >
      curl -sfL {{ _cp_install_script_url }} |
      {% if cp_install_version | length > 0 %}INSTALL_K3S_VERSION="{{ cp_install_version }}"{% else %}INSTALL_K3S_CHANNEL="stable"{% endif %}
      sh -
  become: true
  changed_when: true

- name: Restart k3s server after upgrade
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: restarted
  become: true
  when: cp_node_role == 'control_plane'

- name: Restart k3s agent after upgrade
  ansible.builtin.service:
    name: "{{ _cp_service_name_agent }}"
    state: restarted
  become: true
  when: cp_node_role == 'worker'
