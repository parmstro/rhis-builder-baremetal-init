---
# Shared: preflight checks for etcd snapshot operations
# Used by: backup.yml, restore.yml
# Validates that the target node is a control plane node (etcd runs on servers only)

- name: Validate node is control plane for etcd operations
  ansible.builtin.assert:
    that: cp_node_role == 'control_plane'
    fail_msg: "etcd snapshot operations require cp_node_role == 'control_plane' (got '{{ cp_node_role }}')"
