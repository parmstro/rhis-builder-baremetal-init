---
# Action: restore — restore etcd snapshot (stop → restore → start)

- name: Run etcd preflight checks
  ansible.builtin.include_tasks: etcd_preflight.yml

- name: Stop k3s server before restore
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: stopped
  become: true

- name: Run etcd snapshot restore
  ansible.builtin.command:
    cmd: "{{ _cp_binary }} etcd-snapshot restore --name {{ cp_restore_snapshot_name }}"
  become: true
  changed_when: true

- name: Start k3s server after restore
  ansible.builtin.service:
    name: "{{ _cp_service_name }}"
    state: started
    enabled: true
  become: true
