---
# Which part of the role to run:
#   nagios_server | nagios_client | splunk_server | splunk_forwarder |
#   elastic_server | elastic_agent | eda_rulebooks | baseline
mon_action: baseline

# ===========================================================================
# Baseline orchestrator toggles (mon_action: baseline)
# ===========================================================================
mon_apply_nagios_server: true
mon_apply_nagios_client: true
mon_apply_splunk_server: true
mon_apply_splunk_forwarder: true
mon_apply_elastic_server: true
mon_apply_elastic_agent: true
mon_apply_eda_rulebooks: true

# ===========================================================================
# Nagios Core server (mon_action: nagios_server)
# ===========================================================================
mon_nagios_version: "4.5.2"
mon_nagios_plugins_version: "2.4.10"
mon_nagios_user: nagios
mon_nagios_group: nagios
mon_nagios_web_user: nagiosadmin
mon_nagios_web_password: ""

# Contact / notification
mon_nagios_admin_email: "{{ ansible_user_email | default('ops@example.com') }}"
mon_nagios_notification_interval: 60          # minutes between re-notifications
mon_nagios_enable_slack: false
mon_nagios_slack_webhook: ""
mon_nagios_slack_channel: "#alerts"

# Check intervals
mon_nagios_check_interval: 5                  # minutes
mon_nagios_retry_interval: 1                  # minutes
mon_nagios_max_check_attempts: 3

# Host/service templates registered by this role
mon_nagios_host_templates:
  - name: linux-server
    check_command: check-host-alive
    check_interval: "{{ mon_nagios_check_interval }}"
    retry_interval: "{{ mon_nagios_retry_interval }}"
    max_check_attempts: "{{ mon_nagios_max_check_attempts }}"
    notification_interval: "{{ mon_nagios_notification_interval }}"
    contact_groups: admins

  - name: windows-server
    check_command: check-host-alive
    check_interval: "{{ mon_nagios_check_interval }}"
    retry_interval: "{{ mon_nagios_retry_interval }}"
    max_check_attempts: "{{ mon_nagios_max_check_attempts }}"
    notification_interval: "{{ mon_nagios_notification_interval }}"
    contact_groups: admins

  - name: network-device
    check_command: check-host-alive
    check_interval: 3
    retry_interval: 1
    max_check_attempts: 5
    notification_interval: "{{ mon_nagios_notification_interval }}"
    contact_groups: admins

mon_nagios_service_checks:
  - name: PING
    check_command: "check_ping!100.0,20%!500.0,60%"
    host_template: linux-server
  - name: SSH
    check_command: check_ssh
    host_template: linux-server
  - name: HTTP
    check_command: check_http
    host_template: linux-server
  - name: Disk
    check_command: "check_nrpe!check_disk"
    host_template: linux-server
  - name: Load
    check_command: "check_nrpe!check_load"
    host_template: linux-server
  - name: Memory
    check_command: "check_nrpe!check_mem"
    host_template: linux-server
  - name: Zombie Procs
    check_command: "check_nrpe!check_zombie_procs"
    host_template: linux-server

# Hosts to monitor — populated from inventory or explicit list
mon_nagios_hosts: []
#  - name: web-prod-01
#    address: 10.0.1.100
#    template: linux-server
#  - name: db-prod-01
#    address: 10.0.1.101
#    template: linux-server

# EDA webhook — Nagios posts alerts here for event-driven automation
mon_nagios_eda_webhook_url: ""
mon_nagios_eda_webhook_enabled: false

# ===========================================================================
# Nagios NRPE client (mon_action: nagios_client)
# ===========================================================================
mon_nrpe_allowed_hosts: "127.0.0.1,::1"
mon_nrpe_dont_blame: 0                       # 1 = allow command arguments

mon_nrpe_checks:
  - name: check_disk
    command: "/usr/lib64/nagios/plugins/check_disk -w 20% -c 10% -p /"
  - name: check_load
    command: "/usr/lib64/nagios/plugins/check_load -w 5,4,3 -c 10,8,6"
  - name: check_mem
    command: "/usr/lib64/nagios/plugins/check_swap -w 20% -c 10%"
  - name: check_zombie_procs
    command: "/usr/lib64/nagios/plugins/check_procs -w 5 -c 10 -s Z"
  - name: check_total_procs
    command: "/usr/lib64/nagios/plugins/check_procs -w 250 -c 400"

# ===========================================================================
# Splunk Enterprise server (mon_action: splunk_server)
# ===========================================================================
mon_splunk_version: "9.2.1"
mon_splunk_home: /opt/splunk
mon_splunk_user: splunk
mon_splunk_group: splunk
mon_splunk_admin_user: admin
mon_splunk_admin_password: ""
mon_splunk_http_port: 8000
mon_splunk_mgmt_port: 8089
mon_splunk_receive_port: 9997                 # where forwarders send data
mon_splunk_hec_port: 8088                     # HTTP Event Collector
mon_splunk_hec_token: ""

# Indexes
mon_splunk_indexes:
  - name: security
    max_size_mb: 51200
    frozen_time_period_secs: 7776000          # 90 days
  - name: infrastructure
    max_size_mb: 51200
    frozen_time_period_secs: 7776000
  - name: network
    max_size_mb: 20480
    frozen_time_period_secs: 5184000          # 60 days
  - name: application
    max_size_mb: 20480
    frozen_time_period_secs: 5184000
  - name: ansible_events
    max_size_mb: 10240
    frozen_time_period_secs: 7776000

# Saved searches / alerts that feed EDA
mon_splunk_alerts:
  - name: Failed SSH Authentication
    search: 'index=security sourcetype=linux_secure "Failed password" | stats count by src_ip, dest | where count > 5'
    cron: "*/5 * * * *"
    severity: high
    action_webhook: true
  - name: High CPU Usage
    search: 'index=infrastructure sourcetype=cpu | where pctUsed > 90 | stats avg(pctUsed) as avg_cpu by host'
    cron: "*/5 * * * *"
    severity: medium
    action_webhook: true
  - name: Disk Space Critical
    search: 'index=infrastructure sourcetype=df | where UsePct > 90 | stats max(UsePct) as max_disk by host, MountedOn'
    cron: "*/5 * * * *"
    severity: high
    action_webhook: true
  - name: Unauthorized Privilege Escalation
    search: 'index=security sourcetype=linux_audit type=USER_CMD | search NOT auid=0 | stats count by auid, exe'
    cron: "*/5 * * * *"
    severity: critical
    action_webhook: true

# EDA integration
mon_splunk_eda_webhook_url: ""
mon_splunk_eda_webhook_enabled: false

# ===========================================================================
# Splunk Universal Forwarder (mon_action: splunk_forwarder)
# ===========================================================================
mon_splunk_fwd_version: "{{ mon_splunk_version }}"
mon_splunk_fwd_home: /opt/splunkforwarder
mon_splunk_fwd_user: splunkfwd
mon_splunk_fwd_group: splunkfwd
mon_splunk_fwd_server: ""                     # indexer host:port
mon_splunk_fwd_password: ""

mon_splunk_fwd_inputs:
  - path: /var/log/secure
    sourcetype: linux_secure
    index: security
  - path: /var/log/audit/audit.log
    sourcetype: linux_audit
    index: security
  - path: /var/log/messages
    sourcetype: syslog
    index: infrastructure
  - path: /var/log/cron
    sourcetype: cron
    index: infrastructure

# ===========================================================================
# Elasticsearch server (mon_action: elastic_server)
# ===========================================================================
mon_elastic_version: "8.14"
mon_elastic_cluster_name: rhism-monitoring
mon_elastic_node_name: "{{ inventory_hostname }}"
mon_elastic_network_host: "0.0.0.0"
mon_elastic_http_port: 9200
mon_elastic_transport_port: 9300
mon_elastic_data_path: /var/lib/elasticsearch
mon_elastic_log_path: /var/log/elasticsearch

# Security (xpack)
mon_elastic_security_enabled: true
mon_elastic_password: ""
mon_elastic_api_key: ""

# JVM heap — set to half available RAM, max 32g
mon_elastic_heap_size: "4g"

# Index lifecycle management
mon_elastic_ilm_policies:
  - name: security-policy
    hot_max_size: "50gb"
    hot_max_age: "7d"
    warm_min_age: "7d"
    cold_min_age: "30d"
    delete_min_age: "90d"
  - name: infrastructure-policy
    hot_max_size: "50gb"
    hot_max_age: "7d"
    warm_min_age: "7d"
    cold_min_age: "30d"
    delete_min_age: "60d"

# Index templates
mon_elastic_index_templates:
  - name: security-events
    pattern: "security-*"
    ilm_policy: security-policy
    shards: 1
    replicas: 0
  - name: infrastructure-events
    pattern: "infra-*"
    ilm_policy: infrastructure-policy
    shards: 1
    replicas: 0
  - name: ansible-events
    pattern: "ansible-*"
    ilm_policy: security-policy
    shards: 1
    replicas: 0

# Kibana
mon_kibana_enabled: true
mon_kibana_port: 5601
mon_kibana_server_name: "{{ inventory_hostname }}"

# ===========================================================================
# Elastic Agent / Filebeat (mon_action: elastic_agent)
# ===========================================================================
mon_filebeat_version: "{{ mon_elastic_version }}"
mon_filebeat_output_host: ""                  # elasticsearch host:port
mon_filebeat_output_protocol: https
mon_filebeat_output_username: elastic
mon_filebeat_output_password: ""

mon_filebeat_modules:
  - name: system
    syslog_enabled: true
    auth_enabled: true
  - name: auditd
    log_enabled: true

mon_filebeat_inputs:
  - type: log
    paths:
      - /var/log/messages
      - /var/log/secure
    fields:
      index_prefix: security
  - type: log
    paths:
      - /var/log/audit/audit.log
    fields:
      index_prefix: security
    multiline:
      pattern: '^type='
      negate: true
      match: after

# ===========================================================================
# EDA rulebooks (mon_action: eda_rulebooks)
# ===========================================================================
mon_eda_controller_host: ""                   # EDA controller URL
mon_eda_rulebook_dir: /opt/eda/rulebooks      # where rulebooks are deployed

# Webhook listener port for all monitoring sources
mon_eda_webhook_port: 5000

# Which event sources to enable in rulebooks
mon_eda_sources:
  nagios: true
  splunk: true
  elastic: true

# Response playbook mappings — what to run when events arrive
mon_eda_response_playbooks:
  failed_ssh:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: block_ip
  high_cpu:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: investigate_cpu
  disk_critical:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: disk_cleanup
  privilege_escalation:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: lockdown_host
  service_down:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: restart_service
  host_unreachable:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: diagnose_host
  bug_detection:
    playbook: playbooks/event_response.yml
    extra_vars:
      event_action: file_bug_incident
