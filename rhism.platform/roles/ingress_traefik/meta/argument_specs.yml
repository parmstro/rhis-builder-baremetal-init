---
argument_specs:
  main:
    short_description: Deploy or configure the Traefik ingress controller on Kubernetes.
    description: >-
      Standalone-first ingress backend for container_platform. On k3s it tunes the built-in
      Traefik via HelmChartConfig; on other platforms it deploys Traefik via Helm as the
      default IngressClass. Consumes the shared ingress-backend interface (action, cp_* vars)
      so the container_platform dispatcher can select any backend with identical code.
    options:
      action:
        description: >-
          Lifecycle action, shared across all ingress backends. 'ingress' (and its alias
          'present') deploy/configure Traefik; 'absent' removes it.
        type: str
        default: ingress
        choices:
          - ingress
          - present
          - absent
      cp_kubeconfig_path:
        description: Path to the cluster kubeconfig. Shared ingress-interface var.
        type: str
        default: /etc/rancher/k3s/k3s.yaml
      cp_type:
        description: >-
          Container platform type. On 'k3s' the built-in Traefik is tuned via HelmChartConfig;
          other platforms get a fresh Helm deployment. Shared ingress-interface var.
        type: str
        default: k3s
      cp_ingress_replicas:
        description: Traefik controller replica count. Shared ingress-interface var.
        type: int
        default: 1
      cp_ingress_execute:
        description: >-
          Dry-run gate honoured by every ingress backend. false validates action dispatch and
          variable resolution without changing the node or cluster (used by molecule).
        type: bool
        default: true
