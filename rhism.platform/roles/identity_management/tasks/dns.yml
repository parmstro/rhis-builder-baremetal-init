---
# Manage IPA-integrated DNS zones and records.

- name: Validate dns action applies to this idm_type
  ansible.builtin.assert:
    that:
      - idm_type in ['freeipa', 'rh_idm']
    fail_msg: >-
      idm_action: dns requires an IPA server (idm_type: freeipa or rh_idm).

- name: Manage DNS zones
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ idm_admin_password }}"
    name: "{{ item.name }}"
    forwarders: "{{ item.forwarders | default([]) | map(attribute='ip_address') | list }}"
    forwardpolicy: "{{ item.forward_policy | default('only') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ idm_dns_zones }}"
  when: idm_dns_zones | length > 0

- name: Manage DNS records
  freeipa.ansible_freeipa.ipadnsrecord:
    ipaadmin_password: "{{ idm_admin_password }}"
    zone_name: "{{ item.zone }}"
    name: "{{ item.name }}"
    record_type: "{{ item.type }}"
    record_value: "{{ item.value }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ idm_dns_records }}"
  when: idm_dns_records | length > 0
