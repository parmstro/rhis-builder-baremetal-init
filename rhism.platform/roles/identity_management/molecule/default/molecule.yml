---
# Molecule default scenario for identity_management.
# Validates: dispatcher, type-driven var loading (all three types), baseline
# no-op (all toggles false), and negative dispatch rejection.
# No real FreeIPA/IDM server required — Ansible logic only.
# Collection-hosted scenario: molecule's collection-under-test auto-install
# (prerun) would try to ansible-galaxy-install this collection and its
# dependency into the workspace collections path, clobbering the loader
# symlink at collections/ansible_collections/rhism/<name> ("Cannot call
# rmtree on a symbolic link"). Disabled — local collection checkouts already
# resolve via ANSIBLE_COLLECTIONS_PATH.
prerun: false

dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: idm-test
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    pre_build_image: true
    override_command: true

provisioner:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - converge
    - verify
    - destroy
