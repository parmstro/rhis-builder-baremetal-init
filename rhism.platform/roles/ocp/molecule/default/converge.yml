---
# ocp installs via the openshift-install binary under `become`, which fails on a minimal
# container (no sudo). This scenario validates the STANDALONE CONTRACT on the control host:
# argument-spec enforcement (a real negative test — the role loads fine on Linux), the default
# action, and the presence of every dispatch task file. Functional cluster creation is
# validated in the full-stack test lab, not molecule.
- name: Validate ocp dispatcher + standalone variable contract (control host only)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Negative test — argument spec rejects a bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: ocp
          vars:
            action: bogus_action
        - name: Fail if validation did not catch invalid action
          ansible.builtin.fail:
            msg: "argument_spec should have rejected the bogus action"
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — bogus action correctly rejected"

    - name: Assert standalone default contract
      ansible.builtin.assert:
        that:
          - action == 'present'
        fail_msg: "ocp standalone default contract not satisfied"

    - name: Verify a dispatch task file exists for every declared action
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../tasks/{{ item }}.yml"
      register: _ocp_action_stat
      failed_when: not _ocp_action_stat.stat.exists
      loop:
        - present
        - install
        - configure
        - status
        - upgrade
        - backup
        - restore
