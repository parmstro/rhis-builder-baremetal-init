---
# Action: restore — etcd restore via oc debug node

- name: Run etcd restore via oc debug node
  ansible.builtin.command:
    cmd: >
      oc debug node/{{ inventory_hostname }} --
      chroot /host /usr/local/bin/cluster-restore.sh
      {{ cp_restore_dir | default('/var/backup/etcd') }}
  environment:
    KUBECONFIG: "{{ _cp_kubeconfig_path }}"
  changed_when: true
  become: true
