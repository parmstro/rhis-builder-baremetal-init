---
# registry_internal — standalone-first defaults over the SHARED registry-backend interface.
#
# Every registry backend (registry_internal / registry_generic) consumes the SAME variable
# names, so the container_platform orchestrator selects either of them with one identical call
# — `include_role: name="registry_{{ cp_registry_type }}"` — and never needs per-backend code.
# Standalone callers set these same vars directly; the defaults below make the role runnable
# on its own.

# Shared action (all backends): registry (enable) | present (alias) | absent (remove).
# The orchestrator passes `action` via include_role vars; this default covers standalone use.
action: registry

# Shared platform selector — the built-in registry mechanism differs per NOS/distro
# (ocp/okd use the OpenShift image-registry operator; k3s/rke2 have no built-in registry).
cp_type: k3s

# Shared cluster access (consumed by every backend, set once by the caller). OCP/OKD paths
# often point at the oc binary's kubeconfig; k3s/rke2 at the rancher kubeconfig.
cp_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Shared dry-run gate honoured by every registry backend — false validates dispatch + variable
# resolution without touching the node or cluster (used by the molecule scenario).
cp_registry_execute: true

# Namespace of the platform built-in registry (OCP/OKD image-registry operator).
cp_registry_namespace: openshift-image-registry

# External registry endpoint — read by registry_generic; declared here so the shared interface
# is complete for standalone use of either backend.
cp_registry_url: ""
