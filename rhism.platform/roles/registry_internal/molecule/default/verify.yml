---
- name: Verify standalone variable contract
  hosts: all
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
      delegate_to: localhost

    - name: Assert shared interface defaults resolve for standalone use
      ansible.builtin.assert:
        that:
          - action == 'registry'
          - cp_type == 'k3s'
          - cp_kubeconfig_path == '/etc/rancher/k3s/k3s.yaml'
          - cp_registry_execute | bool
          - cp_registry_namespace == 'openshift-image-registry'
        fail_msg: "registry_internal defaults did not resolve to the expected standalone contract"
      delegate_to: localhost

    - name: Report verification passed
      ansible.builtin.debug:
        msg: "PASS — registry_internal standalone contract verified"
      delegate_to: localhost
