---
galaxy_info:
  namespace: rhism
  role_name: registry_internal
  author: rhism
  description: >-
    Enable and expose the platform built-in container registry — OpenShift image-registry
    operator with default route and push/pull service account on OCP/OKD; defers to
    registry_generic on k3s/rke2. Standalone-first product role, also selectable by the
    container_platform dispatcher (cp_registry_type: internal).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - kubernetes
    - openshift
    - registry
    - container
    - ocp
dependencies: []
