---
# Foreman scenario — dry-run validation on RHEL9 UBI.
# Tests: package listing, installer flag structure, configure + repos API calls
# with content_install_execute: false (no real Foreman instance required).
#
# To run against a real Foreman instance:
#   molecule converge -s foreman -- \
#     -e content_install_execute=true \
#     -e content_server_url=https://foreman.example.com \
#     -e content_username=admin \
#     -e content_password=secret
# Collection-hosted scenario: molecule's collection-under-test auto-install
# (prerun) would try to ansible-galaxy-install this collection into the
# workspace collections path, clobbering the loader symlink at
# collections/ansible_collections/rhism/<name> ("Cannot call rmtree on
# a symbolic link"). Disabled — local collection checkouts already resolve
# via ANSIBLE_COLLECTIONS_PATH.
prerun: false

dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: foreman-test
    image: registry.access.redhat.com/ubi9/ubi:latest
    pre_build_image: true
    override_command: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /sbin/init

provisioner:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - verify
    - destroy
