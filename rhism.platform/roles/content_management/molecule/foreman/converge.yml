---
- name: Converge — Foreman baseline dry-run (all toggles false)
  hosts: all
  gather_facts: true
  vars:
    content_action: baseline
    content_type: foreman
    content_organization: "ACME"
    content_location: "Default Location"
    content_install_execute: false
    content_apply_install: true
    content_apply_configure: false
    content_apply_repos: false
    content_apply_sync: false
    content_apply_content_views: false
    content_apply_activation_keys: false
  roles:
    - role: rhism.platform.content_management

- name: Converge — Foreman repos dry-run with sample products
  hosts: all
  gather_facts: false
  vars:
    content_action: repos
    content_type: foreman
    content_organization: "ACME"
    content_no_log: false
    content_products:
      - name: "Test Product"
        label: test_product
        description: "Test product for molecule"
        repos:
          - name: "Test Repo"
            content_type: yum
            url: https://mirror.centos.org/centos/9-stream/BaseOS/x86_64/os/
            download_policy: on_demand
  tasks:
    - name: Include repos task directly (no API call — only structure validation)
      ansible.builtin.include_role:
        name: content_management
      vars:
        content_action: baseline
        content_type: foreman
