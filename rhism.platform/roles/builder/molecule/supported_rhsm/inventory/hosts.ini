# rhism RHSM test inventory — update ansible_host before running the scenario.
# The target must be a registered RHEL 9 host with SSH key access. A
# deliberately distinct host/domain/realm so that separate scenarios which
# could plausibly target real infrastructure never collide on the same identity.
[all]
rhism-rhsm-01 ansible_host=192.168.100.200 ansible_user=ansible ansible_become=true

[rhism_rhsm]
rhism-rhsm-01
