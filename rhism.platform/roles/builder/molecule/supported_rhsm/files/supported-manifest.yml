---
# rhism deployment manifest (profile: supported) — full Red Hat enterprise stack.
# Copy of molecule/supported/files/supported-manifest.yml for the supported_rhsm scenario.
profile: supported
components:
  identity:
    enabled: true
    type: rh_idm
    ad_trust:
      enabled: false
      domain: ""
      admin: Administrator
      range_type: ipa-ad-trust
  provisioning:
    enabled: true
    type: satellite_proxy
    hosts: []
  content:
    enabled: true
    type: satellite
  mail:
    enabled: true
    type: relay
  scm:
    enabled: true
    type: gitlab_ee
  backup:
    enabled: true
    type: bareos
  container_platform:
    enabled: true
    type: ocp
  security:
    enabled: true
    type: default
  monitoring:
    enabled: true
    type: default
network:
  base_domain: lab.example.com
  management_network: 192.168.100.0/24
  provision_network: 192.168.200.0/24
sizing: large
licensing:
  rhsm: true
  satellite: true
  ocp: true
  gitlab_ee: true
