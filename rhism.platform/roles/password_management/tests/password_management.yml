---
# Password lifecycle management playbook.
# Drives the password_management dispatcher role for create/delete/audit/rotate
# across ansible, vault, and thycotic backends.
#
# Required variables:
#   pm_action  — create | delete | audit | rotate
#   pm_type    — ansible | vault | thycotic
#   pm_target  — target identity (e.g. "db_app_user")
#
# Run examples:
#   # Create via pure Ansible
#   ansible-playbook playbooks/password_management.yml \
#     -e pm_action=create -e pm_type=ansible -e pm_target=db_app_user
#
#   # Rotate via HashiCorp Vault
#   ansible-playbook playbooks/password_management.yml \
#     -e pm_action=rotate -e pm_type=vault -e pm_target=db_app_user \
#     -e pm_vault_url=https://vault.example.com:8200 \
#     -e pm_vault_role_id="${VAULT_ROLE_ID}" \
#     -e pm_vault_secret_id="${VAULT_SECRET_ID}"
#
#   # Audit via Thycotic
#   ansible-playbook playbooks/password_management.yml \
#     -e pm_action=audit -e pm_type=thycotic -e pm_target=db_app_user \
#     -e pm_thycotic_server_url=https://secretserver.example.com \
#     -e pm_thycotic_secret_id=1234

- name: Password lifecycle management
  hosts: "{{ pm_hosts | default('localhost') }}"
  connection: "{{ 'local' if (pm_hosts | default('localhost')) == 'localhost' else 'ssh' }}"
  gather_facts: "{{ pm_gather_facts | default(false) }}"

  pre_tasks:
    - name: Load environment credentials from vault
      ansible.builtin.include_vars:
        file: "inventories/{{ env | default('dev') }}/group_vars/all/vault.yml"
      failed_when: false

  roles:
    - role: password_management
