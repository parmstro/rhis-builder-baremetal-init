---
# Shared preparation for server and replica actions:
# RHSM registration, module stream, packages, firewall.
#
# BUG-094: the module-enable/package-install/firewall tasks below had no dry-run gate at
# all, unconditionally running even when idm_server_install/idm_replica_install were false
# — found via a real molecule run, not by inspection alone. Gated on either install flag
# (this file serves both actions) via a single block-level when:. rhel_subscription's own
# inclusion already had its own gate (rhel_subscription_skip) so it stays outside the block.

- name: Register host with Red Hat Subscription Manager
  ansible.builtin.include_role:
    name: rhel_subscription
  vars:
    rhel_subscription_action: register
    rhel_subscription_method: activation_key
    rhel_subscription_org_id: "{{ idm_rhsm_org_id }}"
    rhel_subscription_activation_key: "{{ idm_rhsm_activation_key }}"
    rhel_subscription_skip: "{{ idm_rhsm_skip_registration | bool }}"

- name: Prepare host for real server/replica install
  when: idm_server_install | bool or idm_replica_install | bool
  become: true
  block:
    - name: Enable IdM server module stream
      ansible.builtin.command:
        cmd: dnf module enable -y idm:DL1/server
      register: _idm_module_enable
      changed_when: "'Enabling' in _idm_module_enable.stdout"

    - name: Install Red Hat IDM server packages
      ansible.builtin.package:
        name: "{{ _idm_server_packages }}"
        state: present

    - name: Open firewall for IDM server services
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      when: idm_manage_firewall | bool
      loop:
        - freeipa-ldap
        - freeipa-ldaps
        - dns
        - kerberos
        - kpasswd
        - http
        - https
        - ntp
