---
- name: Converge — ingress dry-run (dispatch + shared var contract, no cluster)
  hosts: all
  gather_facts: false
  vars:
    action: ingress
    cp_ingress_execute: false
  roles:
    - role: rhism.platform.ingress_nginx

- name: Converge — present dry-run
  hosts: all
  gather_facts: false
  vars:
    action: present
    cp_ingress_execute: false
  roles:
    - role: rhism.platform.ingress_nginx

- name: Converge — absent dry-run
  hosts: all
  gather_facts: false
  vars:
    action: absent
    cp_ingress_execute: false
  roles:
    - role: rhism.platform.ingress_nginx

- name: Converge — default action (standalone, no vars set) dry-run
  hosts: all
  gather_facts: false
  vars:
    cp_ingress_execute: false
  roles:
    - role: rhism.platform.ingress_nginx

- name: Converge — negative test (bogus action must fail)
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: ingress_nginx
          vars:
            action: bogus_action
            cp_ingress_execute: false
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — bogus action correctly rejected"
