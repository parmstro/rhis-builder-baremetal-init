---
- name: Converge — install action dry-run
  hosts: all
  gather_facts: true
  vars:
    kvm_platform_action: install
    kvm_platform_execute: false
  roles:
    - role: kvm_platform

- name: Converge — configure action dry-run
  hosts: all
  gather_facts: true
  vars:
    kvm_platform_action: configure
    kvm_platform_execute: false
  roles:
    - role: kvm_platform

- name: Converge — upgrade action dry-run
  hosts: all
  gather_facts: true
  vars:
    kvm_platform_action: upgrade
    kvm_platform_execute: false
  roles:
    - role: kvm_platform

- name: Converge — remove action dry-run (confirmed)
  hosts: all
  gather_facts: true
  vars:
    kvm_platform_action: remove
    kvm_platform_execute: false
    kvm_platform_confirm_delete: true
  roles:
    - role: kvm_platform

- name: Converge — default action (standalone, no vars set) dry-run
  hosts: all
  gather_facts: true
  vars:
    kvm_platform_execute: false
  roles:
    - role: kvm_platform

- name: Converge — negative test (remove without confirmation must fail)
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt remove without kvm_platform_confirm_delete
      block:
        - name: Call role with remove action, confirm_delete left at default (false)
          ansible.builtin.include_role:
            name: kvm_platform
          vars:
            kvm_platform_action: remove
            kvm_platform_execute: false
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — remove correctly rejected without kvm_platform_confirm_delete: true"

- name: Converge — negative test (bogus action must fail)
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: kvm_platform
          vars:
            kvm_platform_action: bogus_action
            kvm_platform_execute: false
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — bogus action correctly rejected"
