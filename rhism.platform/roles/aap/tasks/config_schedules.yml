---
# config_schedules — schedules on job/workflow templates (aap's own
# config-as-code engine; awx.awx is the API client, not a role dependency).

- name: Create schedules
  awx.awx.schedule:
    name: "{{ item.name }}"
    unified_job_template: "{{ item.unified_job_template }}"
    rrule: "{{ item.rrule }}"
    enabled: "{{ item.enabled | default(true) }}"
    extra_data: "{{ item.extra_data | default(omit) }}"
    state: present
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_admin_user }}"
    controller_password: "{{ aap_admin_password }}"
    validate_certs: "{{ aap_validate_certs }}"
    request_timeout: "{{ aap_api_timeout }}"
  loop: "{{ aap_schedules }}"
  loop_control:
    label: "{{ item.name }}"
