---
# config_projects — SCM projects + initial sync (aap's own config-as-code
# engine; awx.awx is the API client, not a role dependency).

- name: Create projects
  awx.awx.project:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ aap_organization }}"
    scm_type: git
    scm_url: "{{ item.scm_url }}"
    scm_branch: "{{ item.scm_branch | default(aap_scm_branch) }}"
    scm_credential: "{{ aap_scm_credential }}"
    scm_update_on_launch: true
    scm_clean: true
    state: present
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_admin_user }}"
    controller_password: "{{ aap_admin_password }}"
    validate_certs: "{{ aap_validate_certs }}"
    request_timeout: "{{ aap_api_timeout }}"
  loop: "{{ aap_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for project sync to complete
  awx.awx.project_update:
    project: "{{ item.name }}"
    organization: "{{ aap_organization }}"
    wait: true
    timeout: "{{ aap_project_sync_timeout }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_admin_user }}"
    controller_password: "{{ aap_admin_password }}"
    validate_certs: "{{ aap_validate_certs }}"
    request_timeout: "{{ aap_api_timeout }}"
  loop: "{{ aap_projects }}"
  loop_control:
    label: "{{ item.name }}"
