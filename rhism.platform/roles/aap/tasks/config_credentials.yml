---
# config_credentials — custom credential types + credential instances (aap's
# own config-as-code engine; awx.awx is the API client, not a role dependency).

- name: Create custom credential types
  awx.awx.credential_type:
    name: "{{ item.name }}"
    kind: "{{ item.kind }}"
    inputs: "{{ item.inputs }}"
    injectors: "{{ item.injectors }}"
    state: present
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_admin_user }}"
    controller_password: "{{ aap_admin_password }}"
    validate_certs: "{{ aap_validate_certs }}"
    request_timeout: "{{ aap_api_timeout }}"
  loop: "{{ aap_credential_types }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create credentials
  awx.awx.credential:
    name: "{{ item.name }}"
    credential_type: "{{ item.credential_type }}"
    organization: "{{ aap_organization }}"
    inputs: "{{ item.inputs }}"
    description: "{{ item.description | default(omit) }}"
    state: present
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_admin_user }}"
    controller_password: "{{ aap_admin_password }}"
    validate_certs: "{{ aap_validate_certs }}"
    request_timeout: "{{ aap_api_timeout }}"
  loop: "{{ aap_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
