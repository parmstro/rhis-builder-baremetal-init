---
argument_specs:
  main:
    short_description: Deploy Longhorn distributed block storage on Kubernetes.
    description: >-
      Standalone-first storage backend for container_platform. Deploys Longhorn via Helm and
      optionally sets it as the default StorageClass. Consumes the shared storage-backend
      interface (action, cp_* vars) so the container_platform dispatcher can select any
      backend with identical code.
    options:
      action:
        description: >-
          Lifecycle action, shared across all storage backends. 'storage' (and its alias
          'present') deploy Longhorn; 'absent' removes it.
        type: str
        default: storage
        choices:
          - storage
          - present
          - absent
      cp_kubeconfig_path:
        description: Path to the cluster kubeconfig. Shared storage-interface var.
        type: str
        default: /etc/rancher/k3s/k3s.yaml
      cp_storage_make_default:
        description: Make Longhorn the default StorageClass. Shared storage-interface var.
        type: bool
        default: true
      cp_storage_execute:
        description: >-
          Dry-run gate honoured by every storage backend. false validates action dispatch and
          variable resolution without changing the node or cluster (used by molecule).
        type: bool
        default: true
      cp_storage_longhorn_data_path:
        description: Longhorn on-node data directory.
        type: str
        default: /var/lib/longhorn
      cp_storage_longhorn_replicas:
        description: Default Longhorn volume replica count.
        type: int
        default: 3
      storage_longhorn_namespace:
        description: Namespace for the Longhorn Helm release.
        type: str
        default: longhorn-system
