---
# Action + variable interface are validated by meta/argument_specs.yml (ansible-core
# runs the validation automatically at role entry — no manual assert needed).
- name: Deploy Longhorn distributed block storage
  when:
    - action in ['storage', 'present']
    - cp_storage_execute | bool
  block:
    - name: Install Longhorn node prerequisites
      ansible.builtin.package:
        name:
          - open-iscsi
          - nfs-utils
          - util-linux
        state: present
      become: true

    - name: Enable and start iscsid
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true
      become: true

    - name: Create Longhorn data directory
      ansible.builtin.file:
        path: "{{ cp_storage_longhorn_data_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io

    - name: Deploy Longhorn via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ cp_kubeconfig_path }}"
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: "{{ storage_longhorn_namespace }}"
        create_namespace: true
        wait: true
        wait_timeout: 600s
        values:
          defaultSettings:
            defaultDataPath: "{{ cp_storage_longhorn_data_path }}"
            defaultReplicaCount: "{{ cp_storage_longhorn_replicas }}"
            storageOverProvisioningPercentage: 200
            storageMinimalAvailablePercentage: 25
          persistence:
            defaultClass: "{{ cp_storage_make_default | bool }}"
            defaultClassReplicaCount: "{{ cp_storage_longhorn_replicas }}"
      become: true
      notify: storage_longhorn - configure storage

- name: Remove Longhorn distributed block storage
  when:
    - action == 'absent'
    - cp_storage_execute | bool
  block:
    - name: Remove Longhorn Helm release
      kubernetes.core.helm:
        kubeconfig: "{{ cp_kubeconfig_path }}"
        name: longhorn
        release_namespace: "{{ storage_longhorn_namespace }}"
        state: absent
        wait: true
        wait_timeout: 300s
      become: true

    - name: Remove Longhorn namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cp_kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: "{{ storage_longhorn_namespace }}"
        state: absent
      become: true
