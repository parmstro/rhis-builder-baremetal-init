    product role, also selectable by the container_platform dispatcher (cp_storage_type: nfs).
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - kubernetes
    - storage
    - nfs
    - csi
    - helm
dependencies: []
