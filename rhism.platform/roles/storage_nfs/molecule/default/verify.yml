---
- name: Verify standalone variable contract
  hosts: all
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
      delegate_to: localhost

    - name: Assert shared interface defaults resolve for standalone use
      ansible.builtin.assert:
        that:
          - action == 'storage'
          - cp_kubeconfig_path == '/etc/rancher/k3s/k3s.yaml'
          - not (cp_storage_make_default | bool)
          - cp_storage_execute | bool
          - cp_storage_class_name == 'nfs-client'
          - cp_storage_nfs_reclaim_policy == 'Delete'
        fail_msg: "storage_nfs defaults did not resolve to the expected standalone contract"
      delegate_to: localhost

    - name: Report verification passed
      ansible.builtin.debug:
        msg: "PASS — storage_nfs standalone contract verified"
      delegate_to: localhost
