---
# --------------------------------------------------------------------------- #
# smart_proxy — register / manage smart proxies                               #
# --------------------------------------------------------------------------- #
- name: Register smart proxy
  theforeman.foreman.smart_proxy:
    server_url: "{{ content_server_url }}"
    username: "{{ content_username }}"
    password: "{{ content_password }}"
    validate_certs: "{{ content_validate_certs }}"
    name: "{{ item.name }}"
    url: "{{ item.url }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ content_proxies }}"
  no_log: "{{ content_no_log }}"
  when: content_proxies | length > 0
