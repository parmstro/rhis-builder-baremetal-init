- name: Converge — host action dispatches (rhism Phase C item 2, list-guarded no-op)
  hosts: all
  gather_facts: false
  vars:
    action: host
    content_install_execute: false
  roles:
    - role: satellite

- name: Converge — host action with a populated list stays a no-op when content_host_execute
    is false (proves the double-gate, not just the list-guard — a real API call against the
    play's default content_server_url would fail this play outright, since no Satellite exists)
  hosts: all
  gather_facts: false
  vars:
    action: host
    content_install_execute: false
    content_host_execute: false
    content_hosts:
      - fqdn: molecule-test-host.example.com
        hostgroup: "Test Hostgroup"
        compute_resource: baremetal
        power_cycle: true
  roles:
    - role: satellite

