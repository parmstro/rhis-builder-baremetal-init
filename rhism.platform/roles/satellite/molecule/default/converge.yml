---
# Each play exercises a representative action. The list-guarded API actions (cdn_repos, repos,
# sync, content_views, activation_keys, smart_proxy, lifecycle, host) are true no-ops with the
# empty defaults, so they validate dispatch + the shared var contract without a Red Hat
# subscription or live Satellite. content_install_execute stays false throughout (installer
# stays a dry-run).
- name: Converge — cdn_repos action (Satellite-only, list-guarded no-op) dispatches
  hosts: all
  gather_facts: false
  vars:
    action: cdn_repos
    content_install_execute: false
  roles:
    - role: rhism.platform.satellite

- name: Converge — repos action dispatches
  hosts: all
  gather_facts: false
  vars:
    action: repos
    content_install_execute: false
  roles:
    - role: rhism.platform.satellite

