---
# ---------------------------------------------------------------------------
# gitlab_ce — upgrade: update package and reconfigure
# ---------------------------------------------------------------------------

- name: Upgrade GitLab CE
  become: true
  block:
    - name: Validate upgrade is not a dry-run
      ansible.builtin.assert:
        that: scm_upgrade_execute | default(false)
        fail_msg: "scm_upgrade_execute must be true to perform upgrade"

    - name: Update GitLab CE package
      ansible.builtin.dnf:
        name: "{{ _scm_package_name }}"
        state: latest
      notify: gitlab_ce - reconfigure

    - name: Reconfigure GitLab after upgrade
      ansible.builtin.include_tasks: reconfigure.yml
