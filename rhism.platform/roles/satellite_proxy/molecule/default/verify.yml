---
- name: Verify standalone variable contract
  hosts: all
  gather_facts: false
  tasks:
    - name: Load role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"
      delegate_to: localhost

    - name: Assert shared interface defaults resolve for standalone use
      ansible.builtin.assert:
        that:
          - action == 'configure'
          - prov_execute | bool
          - prov_smartproxy_dns | bool
          - prov_smartproxy_dhcp | bool
          - prov_smartproxy_tftp | bool
          - not (prov_smartproxy_realm | bool)
          - prov_content_username == 'admin'
          - prov_content_validate_certs | bool
          - prov_content_organization == 'Default Organization'
          - prov_content_location == 'Default Location'
        fail_msg: "satellite_proxy defaults did not resolve to the expected standalone contract"
      delegate_to: localhost

    - name: Report verification passed
      ansible.builtin.debug:
        msg: "PASS — satellite_proxy standalone contract verified"
      delegate_to: localhost
