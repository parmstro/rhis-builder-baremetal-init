---
- name: Converge — configure dry-run (dispatch + shared var contract, no host changes)
  hosts: all
  gather_facts: false
  vars:
    action: configure
    prov_execute: false
  roles:
    - role: rhism.platform.satellite_proxy

- name: Converge — present dry-run
  hosts: all
  gather_facts: false
  vars:
    action: present
    prov_execute: false
  roles:
    - role: rhism.platform.satellite_proxy

- name: Converge — restarted (service) dry-run
  hosts: all
  gather_facts: false
  vars:
    action: restarted
    prov_execute: false
  roles:
    - role: rhism.platform.satellite_proxy

- name: Converge — status dry-run
  hosts: all
  gather_facts: false
  vars:
    action: status
    prov_execute: false
  roles:
    - role: rhism.platform.satellite_proxy

- name: Converge — default action (standalone, no vars set) dry-run
  hosts: all
  gather_facts: false
  vars:
    prov_execute: false
  roles:
    - role: rhism.platform.satellite_proxy

- name: Converge — negative test (bogus action must fail)
  hosts: all
  gather_facts: false
  tasks:
    - name: Attempt bogus action
      block:
        - name: Call role with invalid action
          ansible.builtin.include_role:
            name: rhism.platform.satellite_proxy
          vars:
            action: bogus_action
            prov_execute: false
      rescue:
        - name: Confirm expected failure was caught
          ansible.builtin.debug:
            msg: "PASS — bogus action correctly rejected"
