description: >-
  rhism.platform — a fully self-contained collection for standing up and
  running a governed Red Hat Enterprise Linux estate: an interactive estate
  wizard, a dependency-ordered builder/orchestrator, a security-hardened web
  UI, and every component role the estate needs (identity, content,
  provisioning, NBDE/Tang key escrow, Linux security hardening, plus the full
  set of optional day-2 components) vendored in-collection. No external
  collection dependency — every role resolves as rhism.platform.<name>.
  Built on RHIS (Red Hat Infrastructure Standard) by Paul Armstrong (parmstro),
  aligned to current versions and integrated into a manifest-driven
  wizard -> builder -> deployer flow.
